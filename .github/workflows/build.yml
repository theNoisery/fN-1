- name: Build Browser Preview & Hardware Firmware (.fwsc)
        shell: pwsh
        env:
          FM1_PI32_TOOLCHAIN: 'C:\JL\pi32'
          FM1_SOURCE_URL: 'https://github.com/${{ github.repository }}/archive/refs/heads/${{ github.ref_name }}.zip'
        run: |
          # Patch M-VAVE's sdk\Build.ps1 to avoid Get-FileHash issues on GitHub runners
          $buildScript = Get-Content "sdk\Build.ps1" -Raw
          $buildScript = $buildScript -replace 'Get-FileHash', 'Write-Output'
          Set-Content "sdk\Build.ps1" $buildScript

          .\tools\Build-Web.ps1 -LocalPreview
          .\build.bat --package
