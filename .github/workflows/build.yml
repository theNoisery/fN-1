name: Build FM1 Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Setup JieLi Toolchain 2.5.3
        shell: pwsh
        run: |
          Write-Host "Downloading JieLi Toolchain 2.5.3..."
          curl.exe -L --retry 3 "https://jl-update.oss-cn-shenzhen.aliyuncs.com/2.5.3.exe" -o jl_installer.exe

          # Extract directly using 7-Zip (pre-installed on windows-latest)
          Write-Host "Extracting installer archive..."
          7z x jl_installer.exe -o"C:\JL_temp" -y | Out-Null

          # Locate the pi32 folder inside the extracted contents
          $foundClang = Get-ChildItem -Path "C:\JL_temp" -Filter "clang.exe" -Recurse | Select-Object -First 1
          if ($foundClang) {
            $pi32Folder = $foundClang.Directory.Parent.FullName
            Write-Host "Found toolchain at: $pi32Folder"
            New-Item -ItemType Directory -Force -Path "C:\JL" | Out-Null
            Copy-Item -Path $pi32Folder -Destination "C:\JL\pi32" -Recurse -Force
          } else {
            # Try running the silent installer if 7-zip nested files differently
            Write-Host "Running fallback installer execution..."
            Start-Process -FilePath ".\jl_installer.exe" -ArgumentList "/S", "/D=C:\JL" -Wait
          }

          if (!(Test-Path "C:\JL\pi32\bin\clang.exe")) {
            throw "Failed to locate C:\JL\pi32\bin\clang.exe. Toolchain setup failed."
          }

          $hash = (Get-FileHash -Path "C:\JL\pi32\bin\clang.exe" -Algorithm SHA256).Hash.ToLower()
          Write-Host "Toolchain clang.exe SHA-256: $hash"

      - name: Build Firmware and Web Installer
        shell: pwsh
        env:
          FM1_PI32_TOOLCHAIN: 'C:\JL\pi32'
          FM1_SOURCE_URL: "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip"
        run: |
          .\build.bat --package

      - name: Upload Flashable Firmware
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FM1-Custom-Firmware
          path: |
            build/official-web/FM1-Official-Open-Source.html
            build/dx7/generated/FM1_OFFICIAL_OPEN.fwsc
            build/**/*.fwsc
